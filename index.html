<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>防止螢幕休眠</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>防止手機螢幕休眠</h1>
  <button id="toggleButton">🟢 點我啟動</button>
  <div id="status">尚未啟動</div>
  <pre id="log"></pre>

  <script src="wake-lock-manager.js"></script>
  <script>
    const logEl = document.getElementById('log');

    const wakeLockManager = new WakeLockManager((active) => {
      document.getElementById('status').textContent = active
        ? '✅ 防休眠已啟動'
        : '❎ 防休眠已解除';
    });

    document.getElementById('toggleButton').addEventListener('click', () => {
      wakeLockManager.toggle();
    });
  </script>
</body>
</html>
